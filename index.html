<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts -->
    <link href="https://db.onlinewebfonts.com/c/c4d8819fda4c3fd79e36cedcc8d422bb?family=Halyard+Display" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Color Picker</h1>
    <h2>Generate harmonious, beautiful color palettes for your next project in a single click. Pick any base hue, select your preferred color theory mode, and instantly unlock balanced schemes complete with clean hex codes ready for your design system.</h2>   
    <main>
        
        <form id="color-scheme">
            <div class="input-ele">
                <input type="color" id="default-color">
                <p>Pick Your Color</p>
            </div>
            <div class="drop-down">
                <select name="colors" id="colors">
                   <option value="triad">Triad</option>
                   <option value="complement">Complement</option>
                   <option value="analogic">analogic</option>
                   <option value="quad"> quad</option>
                   <option value="monochrome">monochrome</option>
                    <option value="monochrome-light">monochrome-light</option>
                </select>
            </div>
            <button id="btn">Get color scheme</button>
        </form>
       
        <div id="color-palette">
           <div class="color-box"></div>
           <p id="color-code"></p>
           </div>

    </main>

   

    <script src="index.js"></script>
    
</body>
</html>
